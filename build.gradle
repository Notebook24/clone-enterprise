import java.util.Properties

buildscript {
    dependencies {
        classpath("org.liquibase:liquibase-core:4.33.0")
    }
}

plugins {
    id 'java'
    id 'groovy'
    id("org.springframework.boot") version "3.3.0"
    id("io.spring.dependency-management") version "1.0.11.RELEASE"
    id("org.unbroken-dome.test-sets") version "4.1.0"
    id("org.liquibase.gradle") version "3.0.2"
}

group = "com.orangeandbronze.enlistment"
version = "0.0.1-SNAPSHOT"
var testcontainersVersion = '1.21.4'

repositories {
    mavenCentral()
}

testSets {
    integrationTest 
}

dependencies {
    implementation("org.apache.commons:commons-collections4:4.4")
    implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa")
    implementation("org.springframework.boot:spring-boot-starter-test")
    implementation("org.springframework.retry:spring-retry")
    implementation("org.springframework:spring-aspects")

    implementation("org.apache.commons:commons-lang3")
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    testImplementation("org.testcontainers:postgresql:$testcontainersVersion")
    testImplementation("org.testcontainers:testcontainers:$testcontainersVersion")
    testImplementation("org.testcontainers:localstack:$testcontainersVersion")
    testImplementation("org.testcontainers:junit-jupiter:$testcontainersVersion")
    runtimeOnly("org.springframework.boot:spring-boot-devtools")
    runtimeOnly("org.postgresql:postgresql")
    integrationTestImplementation sourceSets.test.output
    integrationTestRuntimeOnly('org.liquibase:liquibase-core:4.33.0')

    liquibaseRuntime('org.liquibase:liquibase-core:4.33.0')
    liquibaseRuntime('info.picocli:picocli:4.7.6')
    implementation('net.lbruun.springboot:preliquibase-spring-boot-starter:1.5.0')

    testImplementation("org.spockframework:spock-core:2.4-M4-groovy-4.0")
}

def prop = new Properties()
file('src/main/resources/application.properties').withInputStream {
    prop.load(it)
}

configurations {
    compileOnly {
        extendsFrom(configurations.annotationProcessor)
    }
    liquibaseRuntime.extendsFrom(configurations.runtimeClasspath)
}

liquibase {
    activities {
        main {
            changelogFile 'src/main/resources/db/changelog/db.changelog-master.sql'
            url providers.environmentVariable('SPRING_DATASOURCE_URL').getOrElse(prop.getProperty('spring.datasource.url'))
            username providers.environmentVariable('SPRING_DATASOURCE_USERNAME').getOrElse(prop.getProperty('spring.datasource.username'))
            password providers.environmentVariable('SPRING_DATASOURCE_PASSWORD').getOrElse(prop.getProperty('spring.datasource.password'))
            driver 'org.postgresql.Driver'
        }
    }
    runList = "main"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
